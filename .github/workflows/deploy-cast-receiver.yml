name: Deploy Cast Web Receiver

on:
  push:
    branches: [main]
    paths:
      - "cast-receiver/**"
      - ".github/workflows/deploy-cast-receiver.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out receiver sources
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload receiver bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: cast-receiver

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
