<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TriviaParty — Choisir un buzzer</title><style>*{box-sizing:border-box}body{margin:0;background:#12121d;color:#f5f5fa;font:18px system-ui}main{max-width:1050px;margin:auto;padding:28px 20px}h1{font-size:clamp(28px,5vw,40px)}p{line-height:1.5;color:#bcc5d7}#sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.card{background:#232333;padding:20px;border-radius:16px;border:2px solid transparent}.card.playing{border-color:#75d7cb}h2{font-size:21px;margin:0 0 8px}button{font:700 17px system-ui;border:0;border-radius:10px;padding:12px 22px;background:#75d7cb;color:#102724;cursor:pointer}button:focus-visible{outline:3px solid #ffd54f;outline-offset:4px}.meta{font-size:14px}#status{min-height:28px}#stop{background:#39394c;color:white}</style><main><h1>Quel buzzer pour TriviaParty ?</h1><p>Dix sons originaux, sans voix. Cliquez sur un son pour le comparer aux autres. Un seul joue à la fois. Le n° 1 reprend le ressort actuel. Votre choix ici ne modifie pas encore le buzzer de la partie.</p><button id="stop">Arrêter</button><p id="status" role="status">Choisissez un son à écouter.</p><section id="sounds"></section></main><script>
const sounds=[{"file": "buzzer-01.wav", "name": "Ressort actuel", "duration": 0.68}, {"file": "buzzer-02.wav", "name": "Mini boing", "duration": 0.34}, {"file": "buzzer-03.wav", "name": "Ressort grave", "duration": 0.55}, {"file": "buzzer-04.wav", "name": "Ressort cartoon", "duration": 0.48}, {"file": "buzzer-05.wav", "name": "Buzzer de plateau", "duration": 0.3}, {"file": "buzzer-06.wav", "name": "Double buzz", "duration": 0.42}, {"file": "buzzer-07.wav", "name": "Coup de klaxon", "duration": 0.35}, {"file": "buzzer-08.wav", "name": "Arcade rétro", "duration": 0.26}, {"file": "buzzer-09.wav", "name": "Cloche de comptoir", "duration": 0.62}, {"file": "buzzer-10.wav", "name": "Éclair spatial", "duration": 0.45}];const base=location.protocol==='file:'?'../app/src/main/assets/tv/sounds/':'/tv/sounds/';let current=null;const status=document.getElementById('status');function stop(){if(current){current.pause();current.currentTime=0;}document.querySelectorAll('.playing').forEach(c=>c.classList.remove('playing'));}document.getElementById('stop').onclick=()=>{stop();status.textContent='Lecture arrêtée.'};sounds.forEach((sound,i)=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+sound.name;const info=document.createElement('p');info.className='meta';info.textContent=sound.duration.toLocaleString('fr-FR')+' s · '+sound.file;const button=document.createElement('button');button.textContent='Écouter';button.setAttribute('aria-label','Écouter '+sound.name);const audio=new Audio(base+sound.file);audio.preload='auto';button.onclick=()=>{stop();current=audio;card.classList.add('playing');status.textContent='Écoute : '+sound.name;audio.play().catch(()=>{card.classList.remove('playing');status.textContent='Lecture impossible. Vérifiez que les fichiers audio sont accessibles.'})};audio.onended=()=>card.classList.remove('playing');card.append(h,info,button);document.getElementById('sounds').append(card)});
</script></html>
