<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f1a">
  <title>Trivia Party — Téléviseur</title>
  <link rel="stylesheet" href="/tv/display.css">
</head>
<body>
  <header><span id="category">Salon</span><span id="round"></span></header>
  <main><section id="scene"></section><div id="answering" role="status"></div><div id="answer-overlay" aria-live="polite"></div><div id="answer-feedback" role="status" aria-live="polite"></div></main>
  <aside><div id="scores"></div><div id="timer"></div><p id="connection" role="status">En attente de l’hôte…</p></aside><a href="/tv/audio-credits" target="_blank" rel="noopener" style="position:fixed;left:2vw;bottom:2px;font:11px system-ui;color:#9ca2b5;z-index:8">Crédits des voix</a>
  <button id="tv-audio-control" type="button">Activer le son</button><div id="preview" hidden></div>
  <script>
    // A real 1920 × 1080 viewport keeps vw/vh and wrapping identical to Full HD TV.
    if (!new URLSearchParams(location.search).has('screen')) {
      window.triviaPreviewShell = true;
      document.body.innerHTML = '<iframe title="Écran TV · 1920 × 1080" src="/tv?screen=1" allow="autoplay" style="border:0;position:absolute;width:1920px;height:1080px;transform-origin:top left"></iframe>';
      document.body.style.cssText = 'margin:0;padding:0;display:block;overflow:hidden;background:#000';
      function fitTv() {
        var scale = Math.min(innerWidth / 1920, innerHeight / 1080);
        var frame = document.querySelector('iframe');
        frame.style.transform = 'scale(' + scale + ')';
        frame.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
        frame.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
      }
      addEventListener('resize', fitTv); fitTv();
    }
  </script>
  <script src="/tv/receiver.js"></script>
  <script src="/tv/display.js"></script>
</body>
</html>
